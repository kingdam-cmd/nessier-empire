<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NESSIER EMPIRE — Product Manager (Private)</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0D111A;--ink-soft:#2B2F38;--paper:#FFFFFF;--mist:#F9F9F9;
  --blush:#FBEAF0;--blush-2:#F5D3DD;--pink:#FF66C4;--pink-deep:#E5308A;--rose:#ED7BAB;
  --olive:#595900;--line:#ECE6EA;--muted:#6C6873;
  --shadow:0 18px 50px -24px rgba(13,17,26,.35);--shadow-sm:0 8px 24px -14px rgba(13,17,26,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;line-height:1.05}
:focus-visible{outline:2.5px solid var(--pink-deep);outline-offset:2px;border-radius:4px}

.top{background:var(--ink);color:#fff;padding:16px 22px}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:13px}
.top img{height:34px}
.top .t{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.1em;line-height:1}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.top .who{font-size:11.5px;color:rgba(255,255,255,.55)}
.logout{background:rgba(255,255,255,.12);color:#fff;font-size:11px;letter-spacing:.06em;padding:8px 12px;border-radius:999px}
.logout:hover{background:rgba(255,255,255,.22)}

.shell{max-width:820px;margin:22px auto;padding:0 18px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:22px}
.tabbar{display:flex;gap:4px;background:var(--mist);border-radius:999px;padding:4px;margin-bottom:22px}
.tabbar button{flex:1;padding:11px 6px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.14s;white-space:nowrap}
.tabbar button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--mist);transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose);background:#fff;outline:none}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}

.varlist{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.varrow{display:grid;grid-template-columns:66px 1fr 36px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.vdrop{width:66px;height:80px;border-radius:9px;border:1.6px dashed var(--blush-2);background:var(--blush);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.vdrop:hover{border-color:var(--pink)}
.vdrop img{width:100%;height:100%;object-fit:cover}
.vdrop .plus{font-size:24px;color:var(--pink-deep)}
.vcolour{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;background:var(--mist);width:100%}
.vcolour:focus{outline:none;border-color:var(--rose);background:#fff}
.vrm{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--blush-2);color:var(--pink-deep);font-size:18px;display:flex;align-items:center;justify-content:center;background:#fff}
.vrm:hover{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}
.addvar{width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:11px;font-size:13px;font-weight:600;color:var(--ink);background:#fff}
.addvar:hover{border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);margin-bottom:18px;cursor:pointer}
.chk input{width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.02em;transition:.16s}
.btn.block{width:100%}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 12px 26px -14px rgba(229,48,138,.7)}
.btn-primary:hover{background:var(--pink-deep)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.mini{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--ink)}
.mini:hover{border-color:var(--ink)}
.mini.del{color:var(--pink-deep);border-color:var(--blush-2)}
.mini.del:hover{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}

.live{background:#EAF8EF;border:1px solid #BFE9CE;border-radius:12px;padding:13px 15px;margin-bottom:16px;font-size:13px;color:#1c6b3f;line-height:1.55}
.live b{color:#134a2c}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}

.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prow .th{width:54px;height:64px;border-radius:8px;overflow:hidden;background:var(--blush)}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow .nm{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;line-height:1.1}
.prow .sub{font-size:12px;color:var(--muted)}
.prow .acts{display:flex;gap:6px}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.empty .serif{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ink);margin-bottom:6px}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}

.note{max-width:820px;margin:14px auto 0;padding:0 18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.note b{color:var(--ink-soft)}

/* login */
.gate{position:fixed;inset:0;z-index:200;background:radial-gradient(130% 120% at 30% 15%,#1c2333,#0D111A 60%);display:flex;align-items:center;justify-content:center;padding:22px}
.gate-card{width:100%;max-width:370px;text-align:center;color:#fff}
.gate-card img{height:60px;margin:0 auto 20px;filter:drop-shadow(0 10px 30px rgba(255,102,196,.3))}
.gate-card h2{font-size:32px;color:#fff;margin-bottom:6px}
.gate-card p{color:rgba(255,255,255,.6);font-size:13.5px;margin:0 0 20px}
.gate-card input{width:100%;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:13px;font-size:15px;font-family:inherit;margin-bottom:11px}
.gate-card input:focus{outline:none;border-color:var(--pink)}
.gate-card input::placeholder{color:rgba(255,255,255,.4)}
.gate-card .err{color:var(--pink);font-size:12.5px;min-height:16px;margin-top:8px}
.gate-note{color:rgba(255,255,255,.4);font-size:11px;margin-top:18px;line-height:1.6}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:220;opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg{color:var(--pink)}
.toast.bad svg{color:#ff8a8a}
.salebox{background:var(--mist);border-radius:14px;padding:15px;margin:8px 0 18px}
.btn.sm{padding:9px 15px;font-size:12.5px}
.ordcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:#fff}
.ordtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ordcode{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;letter-spacing:.05em;color:var(--ink)}
.ordwhen{font-size:12px;color:var(--muted);margin-top:1px}
.ordtotal{font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap}
.ordcust{font-size:13.5px;margin-top:10px;font-weight:600}
.ordcust a{color:var(--pink-deep)}
.ordaddr{font-size:12.5px;color:var(--muted);margin-top:2px}
.orditems{font-size:12.5px;color:#444;margin-top:10px;line-height:1.7;background:var(--mist);border-radius:10px;padding:10px 12px}
.ordctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ordctl select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;background:#fff;min-width:150px}
.ordctl input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
/* size chart editor */
.sgunit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;margin-bottom:20px}
.seg{display:inline-flex;background:var(--mist);border-radius:999px;padding:4px;gap:2px}
.seg button{border:none;background:none;cursor:pointer;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:inherit;transition:.14s}
.seg button.active{background:var(--pink);color:#fff}
.sgcat{margin-bottom:24px}
.sgcat-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin:0 0 12px}
.sgrow{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1.2fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.sgrow input{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;width:100%}
.sgrow.sghead{margin-bottom:6px}
.sghead .sgsize-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-left:4px}
.sgh{font-weight:700;background:var(--mist)!important;text-align:center}
.sgsize{font-weight:700;text-align:center}
.sgval{text-align:center}
.sgrm{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;width:28px}
.sgrm:hover{color:#d33}
@media(max-width:560px){.sgrow{grid-template-columns:.8fr 1fr 1fr 1fr 24px;gap:5px}.sgrow input{padding:8px 6px;font-size:12px}}
@media(max-width:560px){.field-row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ---- Supabase ---- */
const SB_URL = "https://taommbqshqovkowlxwos.supabase.co";
const SB_KEY = "sb_publishable_GsRt4iDGGI5nVu67ieUwdg_dcsy3pGP";
const sb = supabase.createClient(SB_URL, SB_KEY);

const CATEGORIES = ["New In","Clothing","Accessories","Lifestyle"];
const CURRENCY = "₦";
const money = n => CURRENCY + Number(n||0).toLocaleString('en-NG');

function id(){return 'p'+Math.random().toString(36).slice(2,9);}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function escapeXml(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));}
function placeholder(name,cat){
  const t=String(name||"NESSIER").slice(0,22);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'>
   <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#FBEAF0'/><stop offset='1' stop-color='#F5D3DD'/></linearGradient></defs>
   <rect width='600' height='800' fill='url(#g)'/>
   <circle cx='300' cy='300' r='120' fill='none' stroke='#FF66C4' stroke-width='6' opacity='.5'/>
   <text x='300' y='315' font-family='Georgia,serif' font-size='84' fill='#0D111A' text-anchor='middle'>NE</text>
   <text x='300' y='470' font-family='Georgia,serif' font-style='italic' font-size='34' fill='#0D111A' text-anchor='middle'>${escapeXml(t)}</text>
   <text x='300' y='520' font-family='Arial' font-size='15' letter-spacing='4' fill='#595900' text-anchor='middle'>${escapeXml((cat||'NESSIER EMPIRE').toUpperCase())}</text>
   </svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}

/* row <-> product mapping (DB uses description/is_new to avoid reserved words) */
function rowToProduct(r){
  return { id:r.id, name:r.name, price:Number(r.price)||0, cat:r.cat, gender:r.gender,
           sizes:Array.isArray(r.sizes)?r.sizes:[], desc:r.description||'',
           new:!!r.is_new, variants:Array.isArray(r.variants)?r.variants:[],
           salePrice:(r.sale_price!==null&&r.sale_price!==undefined)?Number(r.sale_price):null,
           saleEnds:r.sale_ends||null };
}
function productToRow(p){
  return { name:p.name, price:p.price, cat:p.cat, gender:p.gender, sizes:p.sizes,
           description:p.desc||'', is_new:!!p.new, variants:p.variants,
           sale_price:(p.salePrice===''||p.salePrice===null||p.salePrice===undefined)?null:Number(p.salePrice),
           sale_ends:p.saleEnds||null };
}

/* image compression so rows stay small */
function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=800; let{width:w,height:h}=img;
      if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',0.82));}catch(err){cb(e.target.result);}
    };
    img.onerror=()=>cb(e.target.result);
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* state */
let PRODUCTS = [];
let tab = 'add';
let editingId = null;
let draftVariants = [];
let loaded = false;

/* ---- auth ---- */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showApp(session.user); } else { showGate(); }
}
function showGate(){ document.getElementById('gate').style.display='flex'; setTimeout(()=>document.getElementById('loginEmail').focus(),120); }
function showApp(user){
  document.getElementById('gate').style.display='none';
  document.getElementById('whoami').textContent = user?.email || '';
  if(!loaded){ loaded=true; loadProducts(); } else { render(); }
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  btn.disabled=false; btn.textContent='Sign in';
  if(error){ err.textContent = error.message || 'Could not sign in.'; return; }
  document.getElementById('loginPass').value='';
  showApp(data.user);
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').onclick=async()=>{ await sb.auth.signOut(); loaded=false; PRODUCTS=[]; showGate(); };

/* ---- data ---- */
async function loadProducts(){
  const pane=document.getElementById('pane');
  document.getElementById('tabAdd').classList.toggle('active', tab==='add');
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  if(tab==='list'){ pane.innerHTML=`<div class="loading">Loading your products…</div>`; }
  const { data, error } = await sb.from('products').select('*').order('created_at',{ascending:false});
  if(error){ toast('Could not load: '+error.message, true); PRODUCTS=[]; }
  else { PRODUCTS = (data||[]).map(rowToProduct); }
  render();
}

/* ---- render ---- */
function render(){
  document.getElementById('cnt').textContent = PRODUCTS.length;
  document.getElementById('tabAdd').classList.toggle('active', tab==='add');
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  document.getElementById('tabOrders').classList.toggle('active', tab==='orders');
  document.getElementById('tabSize').classList.toggle('active', tab==='size');
  document.getElementById('tabAdd').textContent = editingId ? 'Edit product' : 'Add product';
  const pane = document.getElementById('pane');
  if(tab==='add'){ pane.innerHTML = formHTML(editingId?PRODUCTS.find(p=>p.id===editingId):null); wireForm(); }
  else if(tab==='orders'){ renderOrders(); }
  else if(tab==='size'){ loadSizeEditor(); }
  else { pane.innerHTML = listHTML(); wireList(); }
}
function formHTML(p){
  draftVariants = p
    ? ((p.variants && p.variants.length) ? p.variants.map(v=>({color:v.color||'', img:v.img})) : [{color:'', img:p.img||null}])
    : [{color:'', img:null}];
  const sizes = p?(p.sizes||[]).join(', '):'S, M, L, XL';
  return `
    <label style="display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px">Photos &amp; colours</label>
    <div class="varlist" id="variants">${variantsHTML()}</div>
    <button class="addvar" id="addVar">+ Add another colour / photo</button>
    <div class="hint" style="margin-bottom:16px">Add one photo per colour and give each a colour name (e.g. Blush, Black). With a single photo and no colour name, it stays a simple one-image product.</div>
    <div class="field"><label>Product name</label><input id="fName" value="${p?escapeAttr(p.name):''}" placeholder="e.g. Empress Tailored Blazer"/></div>
    <div class="field-row">
      <div class="field"><label>Price (${CURRENCY})</label><input id="fPrice" type="number" min="0" value="${p?p.price:''}" placeholder="45000"/></div>
      <div class="field"><label>Category</label><select id="fCat">${CATEGORIES.filter(c=>c!=='New In').map(c=>`<option ${p&&p.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Shop for</label><select id="fGender">${['Women','Men','Unisex'].map(g=>`<option ${((p&&(p.gender||'Unisex')===g)||(!p&&g==='Women'))?'selected':''}>${g}</option>`).join('')}</select><div class="hint">Choose “Unisex” to show it under both Women and Men.</div></div>
    <div class="field"><label>Sizes (comma separated)</label><input id="fSizes" value="${sizes}" placeholder="S, M, L, XL  or  One Size"/></div>
    <div class="field"><label>Description</label><textarea id="fDesc" placeholder="What makes this piece special…">${p?escapeAttr(p.desc||''):''}</textarea></div>
    <label class="chk"><input type="checkbox" id="fNew" ${(!p||p.new)?'checked':''}/> Feature under “New In” on the storefront</label>
    <div class="salebox">
      <label style="display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px">⚡ Flash sale (optional)</label>
      <div class="hint" style="margin:0 0 12px">Set a sale price below the normal price to show a slashed price and a “-X%” badge. Add an end time to run a countdown that auto-ends the sale. Leave the sale price empty for no sale.</div>
      <div class="field-row">
        <div class="field"><label>Sale price (${CURRENCY})</label><input id="fSalePrice" type="number" min="0" value="${p&&p.salePrice!=null?p.salePrice:''}" placeholder="e.g. 32000"/></div>
        <div class="field"><label>Sale ends (optional)</label><input id="fSaleEnds" type="datetime-local" value="${p&&p.saleEnds?toLocalInput(p.saleEnds):''}"/></div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary block" id="fSave">${p?'Save changes':'Add product'}</button>
      ${p?'<button class="btn btn-ghost" id="fCancel">Cancel</button>':''}
    </div>`;
}
function variantsHTML(){
  return draftVariants.map((v,i)=>`
    <div class="varrow">
      <div class="vdrop" data-drop="${i}">${v.img?`<img src="${v.img}"/>`:`<span class="plus">＋</span>`}<input type="file" accept="image/*" hidden data-file="${i}"/></div>
      <input class="vcolour" data-colour="${i}" value="${escapeAttr(v.color||'')}" placeholder="Colour name (e.g. Blush)"/>
      <button class="vrm" data-rm="${i}" title="Remove" ${draftVariants.length<=1?'style="visibility:hidden"':''}>×</button>
    </div>`).join('');
}
function renderVariants(){ const box=document.getElementById('variants'); box.innerHTML=variantsHTML(); wireVariants(); }
function wireVariants(){
  const box=document.getElementById('variants');
  box.querySelectorAll('[data-drop]').forEach(d=>{
    const i=+d.dataset.drop;
    const file=box.querySelector('[data-file="'+i+'"]');
    d.onclick=()=>file.click();
    file.onchange=e=>{ const f=e.target.files[0]; if(!f) return; compressImage(f, dd=>{ draftVariants[i].img=dd; renderVariants(); }); };
  });
  box.querySelectorAll('[data-colour]').forEach(inp=>{ inp.oninput=()=>{ draftVariants[+inp.dataset.colour].color=inp.value; }; });
  box.querySelectorAll('[data-rm]').forEach(b=>{ b.onclick=()=>{ draftVariants.splice(+b.dataset.rm,1); if(!draftVariants.length) draftVariants.push({color:'',img:null}); renderVariants(); }; });
}
function wireForm(){
  wireVariants();
  document.getElementById('addVar').onclick=()=>{ draftVariants.push({color:'',img:null}); renderVariants(); };
  document.getElementById('fSave').onclick=saveForm;
  const c=document.getElementById('fCancel'); if(c) c.onclick=()=>{ editingId=null; draftVariants=[]; render(); };
}
async function saveForm(){
  const name=document.getElementById('fName').value.trim();
  const price=parseInt(document.getElementById('fPrice').value)||0;
  const cat=document.getElementById('fCat').value;
  const gender=document.getElementById('fGender').value;
  const sizes=document.getElementById('fSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
  const desc=document.getElementById('fDesc').value.trim();
  const isNew=document.getElementById('fNew').checked;
  const salePriceRaw=document.getElementById('fSalePrice').value.trim();
  const salePrice = salePriceRaw==='' ? null : parseInt(salePriceRaw)||0;
  const saleEndsRaw=document.getElementById('fSaleEnds').value;
  const saleEnds = saleEndsRaw ? new Date(saleEndsRaw).toISOString() : null;
  if(!name){ toast('Please add a product name'); return; }
  if(!price){ toast('Please add a price'); return; }
  if(salePrice!==null && salePrice>=price){ toast('Sale price should be lower than the normal price'); return; }
  const variants = draftVariants.filter(v=>v.img).map(v=>({color:(v.color||'').trim(), img:v.img}));
  if(!variants.length){ variants.push({color:'', img:placeholder(name, gender!=='Unisex'?gender:cat)}); }
  const product = {name,price,cat,gender,sizes:sizes.length?sizes:['One Size'],desc,new:isNew,variants,salePrice,saleEnds};
  const btn=document.getElementById('fSave'); btn.disabled=true; btn.textContent='Saving…';
  let error;
  if(editingId){ ({ error } = await sb.from('products').update(productToRow(product)).eq('id', editingId)); }
  else { ({ error } = await sb.from('products').insert(productToRow(product))); }
  btn.disabled=false;
  if(error){ toast('Could not save: '+error.message, true); btn.textContent = editingId?'Save changes':'Add product'; return; }
  toast(editingId?'Product updated — live now':'Product added — live now');
  editingId=null; draftVariants=[]; tab='list';
  await loadProducts();
}
/* datetime helpers for the sale end field */
function toLocalInput(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function listHTML(){
  const bar=`
    <div class="live"><b>Live shop.</b> Everything below is what your customers see right now. Changes appear on the shop within seconds — no uploading.</div>
    <div class="toolbar">
      <button class="mini" id="bExport">↓ Export backup (.json)</button>
    </div>`;
  if(!PRODUCTS.length) return bar + `<div class="empty"><div class="serif">No products yet</div><p>Add your first piece from the “Add product” tab — it goes live instantly.</p></div>`;
  return bar + `<div class="plist">${PRODUCTS.map(p=>`
    <div class="prow">
      <div class="th"><img src="${p.img||(p.variants&&p.variants[0]&&p.variants[0].img)||placeholder(p.name,p.cat)}" onerror="this.src='${placeholder(p.name,p.cat)}'"/></div>
      <div><div class="nm">${escapeAttr(p.name)}</div><div class="sub">${escapeAttr((p.gender||'Unisex')+' · '+(p.cat||''))} · ${money(p.price)}${(p.salePrice!=null)?` · <b style="color:var(--pink-deep)">Sale ${money(p.salePrice)}</b>`:''}${(p.variants&&p.variants.length>1)?' · '+p.variants.length+' colours':''}${p.new?' · New In':''}</div></div>
      <div class="acts"><button class="mini" data-edit="${p.id}">Edit</button><button class="mini del" data-del="${p.id}">Delete</button></div>
    </div>`).join('')}</div>`;
}
function wireList(){
  const exp=document.getElementById('bExport'); if(exp) exp.onclick=exportBackup;
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ editingId=b.dataset.edit; tab='add'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete this product from your live shop?')) return;
    const { error } = await sb.from('products').delete().eq('id', b.dataset.del);
    if(error){ toast('Could not delete: '+error.message, true); return; }
    toast('Product deleted'); await loadProducts();
  });
}
function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(PRODUCTS,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nessier-products-backup.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Backup downloaded');
  }catch(e){ toast('Export failed', true); }
}

/* tabs + toast */
document.getElementById('tabAdd').onclick=()=>{ tab='add'; render(); };
document.getElementById('tabList').onclick=()=>{ editingId=null; draftVariants=[]; tab='list'; render(); };
document.getElementById('tabOrders').onclick=()=>{ editingId=null; draftVariants=[]; tab='orders'; render(); };
document.getElementById('tabSize').onclick=()=>{ editingId=null; draftVariants=[]; tab='size'; render(); };

/* ---- size guide editor ---- */
const SG_DEFAULT = {
  unit:'cm',
  women:{ cols:["Bust","Waist","Hip"], rows:[
    ["XS","79-81","61-64","86-89"],["S","84-86","66-69","91-94"],["M","89-91","71-74","97-99"],
    ["L","94-99","76-81","102-107"],["XL","102-107","84-89","109-114"],["XXL","109-114","91-97","117-122"]
  ]},
  men:{ cols:["Chest","Waist","Hip"], rows:[
    ["S","89-94","74-79","89-94"],["M","97-102","81-86","97-102"],["L","104-109","89-94","104-109"],
    ["XL","112-117","97-102","112-117"],["XXL","119-124","104-109","119-124"]
  ]}
};
let sgEdit = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
async function loadSizeEditor(){
  const pane=document.getElementById('pane');
  pane.innerHTML=`<div class="loading">Loading size chart…</div>`;
  try{
    const { data, error } = await sb.from('settings').select('value').eq('key','size_guide').maybeSingle();
    if(error) throw error;
    sgEdit = (data && data.value && data.value.women && data.value.men) ? clone(data.value) : clone(SG_DEFAULT);
  }catch(e){
    pane.innerHTML=`<div class="empty"><div class="serif">Couldn’t load the size chart</div><p>${escapeAttr(e.message||'')}</p><p class="hint" style="margin-top:8px">If this is the first time, make sure you’ve run the size-guide database step.</p></div>`;
    return;
  }
  if(!sgEdit.unit) sgEdit.unit='cm';
  renderSizeEditor();
}
function catEditorHTML(catKey, title){
  const g = sgEdit[catKey];
  const heads = g.cols.map((c,ci)=>`<input class="sgh" data-col="${catKey}" data-ci="${ci}" value="${escapeAttr(c)}" placeholder="Measurement"/>`).join('');
  const rows = g.rows.map((r,ri)=>`
    <div class="sgrow">
      <input class="sgsize" data-cat="${catKey}" data-ri="${ri}" data-field="label" value="${escapeAttr(r[0]||'')}" placeholder="Size"/>
      ${[1,2,3].map(vi=>`<input class="sgval" data-cat="${catKey}" data-ri="${ri}" data-vi="${vi}" value="${escapeAttr(r[vi]||'')}" placeholder="e.g. 84-86"/>`).join('')}
      <button class="sgrm" data-rm="${catKey}" data-ri="${ri}" title="Remove size" ${g.rows.length<=1?'style="visibility:hidden"':''}>×</button>
    </div>`).join('');
  return `
    <div class="sgcat">
      <h3 class="sgcat-title">${title}</h3>
      <div class="sgrow sghead">
        <div class="sgsize-lbl">Size</div>${heads}
        <span style="width:28px"></span>
      </div>
      ${rows}
      <button class="addvar" data-add="${catKey}">+ Add a size</button>
    </div>`;
}
function renderSizeEditor(){
  const pane=document.getElementById('pane');
  pane.innerHTML = `
    <div class="live"><b>Your size chart.</b> Enter measurements in whichever unit you use — your shop shows customers both cm and inches automatically. Changes go live on the shop when you press Save.</div>
    <div class="sgunit">
      <span>I’m entering measurements in:</span>
      <div class="seg" id="sgUnitSel">
        <button data-u="cm" class="${sgEdit.unit==='cm'?'active':''}">Centimetres</button>
        <button data-u="in" class="${sgEdit.unit==='in'?'active':''}">Inches</button>
      </div>
    </div>
    ${catEditorHTML('women','Women')}
    ${catEditorHTML('men','Men')}
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary block" id="sgSave">Save size chart</button>
      <button class="btn btn-ghost" id="sgReset">Reset to standard</button>
    </div>
    <p class="hint" style="margin-top:12px">Tip: enter each measurement as a range like <b>84-86</b> (or a single number). Use the same three measurements down the top for every size.</p>`;
  wireSizeEditor();
}
function wireSizeEditor(){
  const pane=document.getElementById('pane');
  pane.querySelectorAll('#sgUnitSel button').forEach(b=>b.onclick=()=>{ sgEdit.unit=b.dataset.u; renderSizeEditor(); });
  pane.querySelectorAll('.sgh').forEach(inp=>inp.oninput=()=>{ sgEdit[inp.dataset.col].cols[+inp.dataset.ci]=inp.value; });
  pane.querySelectorAll('.sgsize').forEach(inp=>inp.oninput=()=>{ sgEdit[inp.dataset.cat].rows[+inp.dataset.ri][0]=inp.value; });
  pane.querySelectorAll('.sgval').forEach(inp=>inp.oninput=()=>{ sgEdit[inp.dataset.cat].rows[+inp.dataset.ri][+inp.dataset.vi]=inp.value; });
  pane.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ sgEdit[b.dataset.rm].rows.splice(+b.dataset.ri,1); if(!sgEdit[b.dataset.rm].rows.length) sgEdit[b.dataset.rm].rows.push(['','','','']); renderSizeEditor(); });
  pane.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ sgEdit[b.dataset.add].rows.push(['','','','']); renderSizeEditor(); });
  document.getElementById('sgSave').onclick=saveSizeGuide;
  document.getElementById('sgReset').onclick=()=>{ if(confirm('Reset the size chart back to the standard sizes?')){ sgEdit=clone(SG_DEFAULT); renderSizeEditor(); toast('Reset — press Save to publish'); } };
}
async function saveSizeGuide(){
  // clean up empty rows
  ['women','men'].forEach(k=>{ sgEdit[k].rows = sgEdit[k].rows.filter(r=>(r[0]||'').trim()!==''); if(!sgEdit[k].rows.length) sgEdit[k].rows=clone(SG_DEFAULT[k].rows); });
  const btn=document.getElementById('sgSave'); btn.disabled=true; btn.textContent='Saving…';
  const { error } = await sb.from('settings').upsert({ key:'size_guide', value:sgEdit, updated_at:new Date().toISOString() });
  btn.disabled=false; btn.textContent='Save size chart';
  if(error){ toast('Could not save: '+error.message, true); return; }
  toast('Size chart saved — live on your shop now');
}

/* ---- orders / package tracking ---- */
let ORDERS = [];
const ORDER_STAGES = ["Order received","Preparing","Shipped","Out for delivery","Delivered","Cancelled"];
async function renderOrders(){
  const pane=document.getElementById('pane');
  pane.innerHTML=`<div class="loading">Loading orders…</div>`;
  const { data, error } = await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(error){ pane.innerHTML=`<div class="empty"><div class="serif">Couldn’t load orders</div><p>${escapeAttr(error.message)}</p><p class="hint" style="margin-top:8px">If this is the first time, make sure you’ve run the database upgrade for tracking.</p></div>`; return; }
  ORDERS = data||[];
  if(!ORDERS.length){
    pane.innerHTML=`<div class="live"><b>Orders appear here automatically.</b> When a customer checks out on your shop, their order and tracking code land here for you to update.</div><div class="empty"><div class="serif">No orders yet</div><p>Share your shop link — new orders will show up here.</p></div>`;
    return;
  }
  pane.innerHTML = `<div class="live"><b>${ORDERS.length} order${ORDERS.length>1?'s':''}.</b> Set each order’s status and your customer can follow it live with their tracking code.</div>` + ORDERS.map(orderCardHTML).join('');
  wireOrders();
}
function orderCardHTML(o){
  const items = Array.isArray(o.items)?o.items:[];
  const when = o.created_at ? new Date(o.created_at).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  const itemLines = items.map(it=>`${it.qty||1}× ${escapeAttr(it.name||'')}${it.color?' ('+escapeAttr(it.color)+')':''}${it.size?' — '+escapeAttr(it.size):''}`).join('<br>') || '—';
  const phoneDigits = (o.customer_phone||'').replace(/[^0-9]/g,'');
  return `
  <div class="ordcard" data-id="${o.id}">
    <div class="ordtop">
      <div><div class="ordcode">${escapeAttr(o.tracking_code||'—')}</div><div class="ordwhen">${when}</div></div>
      <div class="ordtotal">${money(o.total)}</div>
    </div>
    <div class="ordcust">${escapeAttr(o.customer_name||'—')}${phoneDigits?` · <a href="https://wa.me/${phoneDigits}" target="_blank" rel="noopener">${escapeAttr(o.customer_phone)}</a>`:''}</div>
    ${o.address?`<div class="ordaddr">${escapeAttr(o.address)}</div>`:''}
    <div class="orditems">${itemLines}</div>
    <div class="ordctl">
      <select data-status="${o.id}">${ORDER_STAGES.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <input data-note="${o.id}" value="${escapeAttr(o.status_note||'')}" placeholder="Optional note (courier, ETA…)"/>
      <button class="btn btn-primary sm" data-save="${o.id}">Update</button>
      <button class="btn btn-ghost sm" data-delo="${o.id}">Delete</button>
    </div>
  </div>`;
}
function wireOrders(){
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save;
    const status=document.querySelector('[data-status="'+id+'"]').value;
    const note=document.querySelector('[data-note="'+id+'"]').value.trim();
    b.disabled=true; b.textContent='Saving…';
    const { error } = await sb.from('orders').update({status, status_note:note, updated_at:new Date().toISOString()}).eq('id',id);
    b.disabled=false; b.textContent='Update';
    if(error){ toast('Could not update: '+error.message, true); return; }
    toast('Order updated — customer can see it');
    const o=ORDERS.find(x=>x.id===id); if(o){ o.status=status; o.status_note=note; }
  });
  document.querySelectorAll('[data-delo]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete this order? This cannot be undone.')) return;
    const { error } = await sb.from('orders').delete().eq('id', b.dataset.delo);
    if(error){ toast('Could not delete: '+error.message, true); return; }
    toast('Order deleted'); renderOrders();
  });
}
let tT;
function toast(m, bad){ const t=document.getElementById('toast'); t.className='toast'+(bad?' bad':''); t.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">${bad?'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/>':'<path d="M20 7 9 18l-5-5"/>'}</svg>${m}`; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2600); }

initAuth();
</script>
</body>
